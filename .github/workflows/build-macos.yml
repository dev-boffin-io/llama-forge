name: Build — macOS

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: macos-13          # Intel
          - arch: arm64
            runner: macos-14          # Apple Silicon (M1+)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Dependencies ───────────────────────────────────────────
      - name: Install build dependencies
        run: |
          brew install cmake ninja

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: pip install "PyQt6>=6.6" pyinstaller

      # ── llama.cpp build (Metal enabled by default on macOS) ────
      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=ON \
            -DGGML_METAL=ON \
            -DGGML_NATIVE=OFF

      - name: Build
        run: cmake --build build --parallel $(sysctl -n hw.logicalcpu)

      # ── llama_gui PyInstaller ──────────────────────────────────
      - name: Package llama_gui
        run: |
          pyinstaller --onefile --windowed \
            --name llama-forge-gui \
            --add-data "llama_gui/llama_gui.png:llama_gui" \
            --hidden-import PyQt6 \
            --hidden-import PyQt6.QtWidgets \
            --hidden-import PyQt6.QtCore \
            --hidden-import PyQt6.QtGui \
            --osx-bundle-identifier io.dev-boffin.llama-forge \
            llama_gui/app.py

      # ── Collect artifacts ──────────────────────────────────────
      - name: Collect binaries
        run: |
          mkdir -p dist-release

          BINS=(
            llama-cli llama-server llama-quantize
            llama-bench llama-imatrix llama-perplexity
            llama-gguf-split llama-gguf-hash llama-gguf
            llama-export-lora llama-cvector-generator
            llama-tts llama-mtmd-cli llama-rpc-server
            llama-tokenize llama-speculative llama-speculative-simple
            llama-embedding
          )
          for bin in "${BINS[@]}"; do
            [ -f "build/bin/$bin" ] && cp "build/bin/$bin" dist-release/
          done

          # Copy .app bundle if present, otherwise the flat binary
          if [ -d "dist/llama-forge-gui.app" ]; then
            cp -R dist/llama-forge-gui.app dist-release/
          elif [ -f "dist/llama-forge-gui" ]; then
            cp dist/llama-forge-gui dist-release/
            chmod +x dist-release/llama-forge-gui
          fi

          # Metal shader (required at runtime for Metal builds)
          [ -f "build/bin/ggml-metal.metal" ] && cp "build/bin/ggml-metal.metal" dist-release/
          [ -f "build/bin/default.metallib" ] && cp "build/bin/default.metallib" dist-release/

          for f in tools/convert_hf_to_gguf.py convert_hf_to_gguf.py; do
            [ -f "$f" ] && cp "$f" dist-release/ && break
          done
          for f in convert_lora_to_gguf.py tools/convert_lora_to_gguf.py; do
            [ -f "$f" ] && cp "$f" dist-release/ && break
          done
          for f in convert_llama_ggml_to_gguf.py tools/convert_llama_ggml_to_gguf.py; do
            [ -f "$f" ] && cp "$f" dist-release/ && break
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-forge-macos-${{ matrix.arch }}
          path: dist-release/
          if-no-files-found: warn
