name: Build — Windows x64

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── MSVC environment ──────────────────────────────────────
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # ── Python (needed by llama_gui CMakeLists.txt) ───────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install pyinstaller requests

      # ── llama.cpp full build ──────────────────────────────────
      - name: Configure CMake
        run: |
          cmake -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DLLAMA_BUILD_TESTS=OFF `
            -DLLAMA_BUILD_EXAMPLES=ON `
            -DGGML_NATIVE=OFF

      - name: Build
        run: cmake --build build --parallel

      # ── llama_gui PyInstaller ─────────────────────────────────
      - name: Package llama_gui
        run: |
          pyinstaller --onefile --noconsole `
            --name llama-forge-gui `
            --add-data "llama_gui/llama_gui.png;llama_gui" `
            --hidden-import tkinter `
            --hidden-import tkinter.ttk `
            --hidden-import tkinter.scrolledtext `
            --hidden-import tkinter.messagebox `
            --hidden-import tkinter.filedialog `
            llama_gui/app.py

      # ── Collect artifacts ─────────────────────────────────────
      - name: Collect binaries
        run: |
          $out = "dist-release"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          $bins = @(
            "llama-cli", "llama-server", "llama-quantize",
            "llama-gguf-split", "llama-imatrix", "llama-bench",
            "llama-perplexity", "llama-cvector-generator"
          )
          foreach ($b in $bins) {
            # Ninja build: bin\ directly; MSBuild: bin\Release\
            foreach ($p in @("build\bin\$b.exe", "build\bin\Release\$b.exe")) {
              if (Test-Path $p) { Copy-Item $p $out; break }
            }
          }

          Copy-Item dist\llama-forge-gui.exe $out

          foreach ($f in @("tools\convert_hf_to_gguf.py", "convert_hf_to_gguf.py")) {
            if (Test-Path $f) { Copy-Item $f $out; break }
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-forge-windows-x64
          path: dist-release/
          if-no-files-found: warn
