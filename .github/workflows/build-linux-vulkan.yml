name: Build — Linux Vulkan

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Dependencies ───────────────────────────────────────────
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build \
            libvulkan-dev vulkan-tools glslc \
            python3 python3-pip python3-venv \
            libxcb-xinerama0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-xkb1 libxkbcommon-x11-0 \
            libgl1 libglib2.0-0 libdbus-1-3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: pip install "PyQt6>=6.6" pyinstaller

      # ── llama.cpp Vulkan build ─────────────────────────────────
      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=ON \
            -DGGML_VULKAN=ON \
            -DGGML_NATIVE=OFF \
            -DLLAMA_BUILD_UI=OFF

      - name: Build
        run: cmake --build build --parallel $(nproc)

      # ── llama_gui PyInstaller ──────────────────────────────────
      - name: Package llama_gui
        run: |
          pyinstaller --onefile \
            --name llama-forge-gui \
            --add-data "llama_gui/llama_gui.png:llama_gui" \
            --hidden-import PyQt6 \
            --hidden-import PyQt6.QtWidgets \
            --hidden-import PyQt6.QtCore \
            --hidden-import PyQt6.QtGui \
            llama_gui/app.py

      # ── Collect artifacts ──────────────────────────────────────
      - name: Collect binaries
        run: |
          mkdir -p dist-release

          BINS=(
            llama-cli llama-server llama-quantize
            llama-bench llama-imatrix llama-perplexity
            llama-gguf-split llama-gguf-hash llama-gguf
            llama-export-lora llama-cvector-generator
            llama-tts llama-mtmd-cli llama-rpc-server
            llama-tokenize llama-speculative llama-speculative-simple
            llama-embedding
          )
          for bin in "${BINS[@]}"; do
            [ -f "build/bin/$bin" ] && cp "build/bin/$bin" dist-release/
          done

          cp dist/llama-forge-gui dist-release/
          chmod +x dist-release/llama-forge-gui

          for f in tools/convert_hf_to_gguf.py convert_hf_to_gguf.py; do
            [ -f "$f" ] && cp "$f" dist-release/ && break
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-forge-linux-vulkan-amd64
          path: dist-release/
          if-no-files-found: warn
