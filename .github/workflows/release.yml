name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: true

jobs:
  # ── Build সব platform একসাথে ────────────────────────────────────────────────

  linux-amd64:
    uses: ./.github/workflows/build-linux-amd64.yml

  linux-arm64:
    uses: ./.github/workflows/build-linux-arm64.yml

  windows-x64:
    uses: ./.github/workflows/build-windows.yml

  macos:
    uses: ./.github/workflows/build-macos.yml

  android:
    uses: ./.github/workflows/build-android-termux.yml

  # ── Release publish ──────────────────────────────────────────────────────────

  publish:
    name: Publish GitHub Release
    needs:
      - linux-amd64
      - linux-arm64
      - windows-x64
      - macos
      - android
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Download all artifacts
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      # Zip each platform folder
      - name: Package artifacts as ZIPs
        run: |
          cd artifacts
          for dir in */; do
            name="${dir%/}"
            zip -r "../${name}.zip" "$dir"
          done
          cd ..
          ls -lh *.zip

      - name: Get tag name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.TAG }}
          name: "llama-forge ${{ steps.tag.outputs.TAG }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: "*.zip"
          body: |
            ## llama-forge ${{ steps.tag.outputs.TAG }}

            GUI frontend for llama.cpp — all platforms.

            ### Downloads

            | Platform | File | Notes |
            |----------|------|-------|
            | Linux x64 (CPU+OpenBLAS) | `llama-forge-linux-amd64.zip` | Ubuntu 22.04+ |
            | Linux ARM64 (CPU+OpenBLAS) | `llama-forge-linux-arm64.zip` | Ubuntu 24.04 ARM |
            | Windows x64 | `llama-forge-windows-x64.zip` | Win10/11 x64 |
            | Windows ARM64 | `llama-forge-windows-arm64.zip` | Win11 ARM |
            | macOS x86_64 (Metal) | `llama-forge-macos-x86_64.zip` | macOS 13+ Intel |
            | macOS arm64 (Metal) | `llama-forge-macos-arm64.zip` | macOS 14+ Apple Silicon |
            | Android ARM64 (binaries only) | `llama-forge-android-arm64.zip` | Termux — run GUI via `python app.py` |

            > GPU builds (CUDA, Vulkan) are available as workflow artifacts from individual build runs.

            ### Running

            ```bash
            # Linux / macOS
            ./llama-forge-gui

            # Windows
            llama-forge-gui.exe

            # Termux
            pip install PyQt6 && python llama_gui/app.py
            ```
